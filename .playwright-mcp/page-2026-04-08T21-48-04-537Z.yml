        - generic [ref=e160]:
          - paragraph [ref=e161]: Missing a GST return filing deadline costs money every day. This calculator tells you exactly how much.
          - paragraph [ref=e162]: Late fee for GSTR-1 and GSTR-3B is Rs. 50 per day per return for non-nil returns (Rs. 25 CGST + Rs. 25 SGST) under Section 47 of the CGST Act, 2017, as revised by CBIC Notification 19/2021. For nil returns - months with no sales - the rate drops to Rs. 20 per day, capped at Rs. 500 per return.
          - paragraph [ref=e163]: For GSTR-9 (the annual return), the rate is Rs. 200 per day, but the total is capped at 0.50% of your annual turnover (0.25% CGST + 0.25% SGST) under Section 47(2) of the CGST Act.
          - paragraph [ref=e164]: If you also have outstanding tax that has not been paid, interest accrues separately at 18% per annum on that amount under Section 50. Interest is not capped - it compounds daily until the tax is actually paid.
          - paragraph [ref=e165]: Select your return type, enter how many days late you are, and add any outstanding tax liability to see your full exposure. The calculator separates late fee from interest so you know what is fixed and what is still growing.
        - generic [ref=e166]:
          - generic [ref=e167]:
            - generic [ref=e168]: "02"
            - heading "How to Use This Calculator" [level=2] [ref=e169]
          - generic [ref=e170]:
            - paragraph [ref=e172]: "What the numbers mean:"
            - paragraph [ref=e173]: Late fee is fixed once you file - it stops the moment the return is submitted. The amount shown is what you owe today.
            - paragraph [ref=e174]: Interest on unpaid tax continues to grow every day until the tax is paid - filing the return alone does not stop it. If you have outstanding tax, pay it and file simultaneously.
            - paragraph [ref=e176]: "Turnover-based caps for GSTR-1 and GSTR-3B:"
            - paragraph [ref=e177]: "-Turnover up to Rs. 1.5 crore: Rs. 2,000 per return"
            - paragraph [ref=e178]: "-Turnover Rs. 1.5 crore to Rs. 5 crore: Rs. 5,000 per return"
            - paragraph [ref=e179]: "-Turnover above Rs. 5 crore: Rs. 10,000 per return"
            - paragraph [ref=e180]: These caps were introduced by CBIC Notification 19/2021. The calculator applies the standard Rs. 5,000 cap as a conservative estimate - check the exact cap for your AATO.
            - generic [ref=e181]:
              - paragraph [ref=e182]: "Next step:"
              - paragraph [ref=e183]: File the return immediately. The late fee is payable in cash only - you cannot use ITC from your credit ledger to pay it.
        - generic [ref=e184]:
          - generic [ref=e185]:
            - generic [ref=e186]: "03"
            - heading "Frequently Asked Questions" [level=2] [ref=e187]
          - generic [ref=e188]:
            - generic [ref=e189]:
              - heading "What is the late fee for GSTR-3B?" [level=3] [ref=e190]
              - paragraph [ref=e191]: Rs. 50 per day per return for non-nil returns (Rs. 25 CGST + Rs. 25 SGST), capped at Rs. 10,000 per return for turnover above Rs. 5 crore. Rs. 20 per day for nil returns, capped at Rs. 500. Rates per CBIC Notification 19/2021, effective June 2021.
            - generic [ref=e192]:
              - heading "Is the late fee different for nil returns?" [level=3] [ref=e193]
              - paragraph [ref=e194]: Yes. If you had no sales in the period and are filing a nil return, the late fee is Rs. 20 per day (Rs. 10 CGST + Rs. 10 SGST), capped at Rs. 500 per return. This is significantly lower than the Rs. 50/day rate for non-nil returns.
            - generic [ref=e195]:
              - heading "What is the late fee for GSTR-9 (annual return)?" [level=3] [ref=e196]
              - paragraph [ref=e197]: Rs. 200 per day (Rs. 100 CGST + Rs. 100 SGST), capped at 0.50% of your annual turnover in the state. The 0.50% is the combined cap - 0.25% per Act under Section 47(2) of the CGST Act. GSTR-9 is mandatory only above Rs. 2 crore annual turnover.
            - generic [ref=e198]:
              - heading "Can I pay the late fee using ITC from my credit ledger?" [level=3] [ref=e199]
              - paragraph [ref=e200]: No. Late fees must be paid in cash from your electronic cash ledger. You cannot use Input Tax Credit to pay GST late fees. This is explicitly stated in the GST law - ITC can only offset tax liability, not fees or penalties.
            - generic [ref=e201]:
              - heading "What happens if I do not file GST returns for 6 months?" [level=3] [ref=e202]
              - paragraph [ref=e203]: After 6 consecutive months of non-filing, the GST portal suspends your GSTIN. You cannot generate e-way bills or file new returns until all pending returns are filed. After suspension, the department can initiate suo-moto cancellation of your GST registration.
            - generic [ref=e204]:
              - heading "Does interest apply even if I file on time but have unpaid tax?" [level=3] [ref=e205]
              - paragraph [ref=e206]: Yes. Section 50 of the CGST Act charges interest at 18% per annum on outstanding tax from the original due date, regardless of when you file the return. Filing on time stops the late fee but does not stop interest on unpaid tax.
