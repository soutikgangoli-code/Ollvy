            - list [ref=e110]:
              - listitem [ref=e111]:
                - generic [ref=e112]: •
                - generic [ref=e113]: Your aggregate turnover crosses Rs. 20 lakh in a financial year (Rs. 10 lakh in special category states for services, Rs. 40 lakh for goods-only suppliers in most states)
              - listitem [ref=e114]:
                - generic [ref=e115]: •
                - generic [ref=e116]: You make any interstate supply - even a single sale to a customer in another state
              - listitem [ref=e117]:
                - generic [ref=e118]: •
                - generic [ref=e119]: You sell through any e-commerce platform - mandatory regardless of turnover
              - listitem [ref=e120]:
                - generic [ref=e121]: •
                - generic [ref=e122]: You are liable to pay tax under reverse charge
              - listitem [ref=e123]:
                - generic [ref=e124]: •
                - generic [ref=e125]: You are an agent of a registered supplier
            - paragraph [ref=e126]: "Source: Section 22 and Section 24, Central Goods and Services Tax Act, 2017. *Special category states: Manipur, Mizoram, Nagaland, Tripura, Arunachal Pradesh, Sikkim, Meghalaya, Assam, Himachal Pradesh, Uttarakhand, J&K"
          - generic [ref=e128]:
            - generic [ref=e129]:
              - generic [ref=e130]: "02"
              - 'heading "Interstate Supply: The Trigger Most People Miss" [level=2] [ref=e131]'
            - paragraph [ref=e134]: If you provide services or sell goods to customers outside your state - even if your total turnover is Rs. 5 lakh - you need GST registration. There is no threshold for interstate supply.
            - list [ref=e135]:
              - listitem [ref=e136]:
                - generic [ref=e137]: •
                - generic [ref=e138]: You are a Mumbai-based freelancer building a website for a Delhi client - that is an interstate supply
              - listitem [ref=e139]:
                - generic [ref=e140]: •
                - generic [ref=e141]: You sell handmade products to customers across India via your own website - interstate supply
              - listitem [ref=e142]:
                - generic [ref=e143]: •
                - generic [ref=e144]: You provide consulting to companies in multiple states - interstate supply
            - paragraph [ref=e145]: "Source: Section 24, CGST Act. One narrow exception: interstate supply of services below Rs. 20 lakh may be exempt under Notification 10/2017 Central Tax - but this does not apply to goods at all."
          - generic [ref=e147]:
            - generic [ref=e148]:
              - generic [ref=e149]: "03"
              - 'heading "E-commerce: No Threshold At All" [level=2] [ref=e150]'
            - paragraph [ref=e153]: Selling through any e-commerce platform means mandatory registration from day one. No turnover threshold applies.
            - list [ref=e154]:
              - listitem [ref=e155]:
                - generic [ref=e156]: •
                - generic [ref=e157]: Amazon, Flipkart, Meesho, Myntra - any marketplace
              - listitem [ref=e158]:
                - generic [ref=e159]: •
                - generic [ref=e160]: Swiggy, Zomato, Dunzo - any food or delivery platform
              - listitem [ref=e161]:
                - generic [ref=e162]: •
                - generic [ref=e163]: Urban Company and similar service platforms
              - listitem [ref=e164]:
                - generic [ref=e165]: •
                - generic [ref=e166]: Your own website if you use a payment gateway and ship to multiple states
            - paragraph [ref=e167]: "Source: Section 24(ix), CGST Act 2017. The platform must deduct TCS from your sales - that mechanism only works with a GSTIN."
          - generic [ref=e169]:
            - generic [ref=e170]:
              - generic [ref=e171]: "04"
              - heading "When You Genuinely Do Not Need Gst" [level=2] [ref=e172]
            - paragraph [ref=e175]: "You are exempt if all of these are true at the same time:"
            - list [ref=e176]:
              - listitem [ref=e177]:
                - generic [ref=e178]: •
                - generic [ref=e179]: Your aggregate turnover is below the threshold for your business type and state
              - listitem [ref=e180]:
                - generic [ref=e181]: •
                - generic [ref=e182]: You make no interstate supply
              - listitem [ref=e183]:
                - generic [ref=e184]: •
                - generic [ref=e185]: You sell through no e-commerce platform
              - listitem [ref=e186]:
                - generic [ref=e187]: •
                - generic [ref=e188]: You are not liable to pay reverse charge
              - listitem [ref=e189]:
                - generic [ref=e190]: •
                - generic [ref=e191]: You deal only in GST-exempt goods or services (fresh vegetables, certain healthcare, core education)
              - listitem [ref=e192]:
                - generic [ref=e193]: •
                - generic [ref=e194]: You are engaged exclusively in agriculture
            - paragraph [ref=e195]: Having a bank account, Udyam certificate, or shop licence does not automatically trigger GST registration. These are separate things.
          - generic [ref=e197]:
            - generic [ref=e198]:
              - generic [ref=e199]: "05"
              - heading "Why Exempt Businesses Sometimes Register Anyway" [level=2] [ref=e200]
            - paragraph [ref=e203]: Voluntary registration exists for practical reasons.
            - list [ref=e204]:
              - listitem [ref=e205]:
                - generic [ref=e206]: •
                - generic [ref=e207]: "Input Tax Credit: If you are registered, you can claim back the GST you pay on purchases and reduce your tax liability"
              - listitem [ref=e208]:
                - generic [ref=e209]: •
                - generic [ref=e210]: "B2B credibility: Business clients can only claim ITC from registered suppliers - without your GSTIN, they absorb that tax as a cost"
              - listitem [ref=e211]:
                - generic [ref=e212]: •
                - generic [ref=e213]: "Tender eligibility: Government tenders often require GSTIN as a baseline condition"
              - listitem [ref=e214]:
                - generic [ref=e215]: •
                - generic [ref=e216]: "E-commerce readiness: If you plan to sell on Amazon or Flipkart in the future, you will need GSTIN anyway"
              - listitem [ref=e217]:
                - generic [ref=e218]: •
                - generic [ref=e219]: "Loan applications: Banks increasingly ask for GST returns as income proof"
            - paragraph [ref=e220]: Voluntary registration is under Section 25(3) of the CGST Act. Once you register voluntarily, all provisions of the Act apply, including return filing obligations.
          - generic [ref=e222]:
            - generic [ref=e223]:
              - generic [ref=e224]: "06"
              - heading "What Happens If You Do Not Register When You Should" [level=2] [ref=e225]
            - list [ref=e226]:
              - listitem [ref=e227]:
                - generic [ref=e228]: •
                - generic [ref=e229]: "Penalty: 100% of the tax due or Rs. 10,000, whichever is higher (Section 122)"
              - listitem [ref=e230]:
                - generic [ref=e231]: •
                - generic [ref=e232]: "Interest: 18% per annum on unpaid tax from the date it was due"
              - listitem [ref=e233]:
                - generic [ref=e234]: •
                - generic [ref=e235]: "No ITC recovery: You cannot claim back GST paid on purchases while you were unregistered"
              - listitem [ref=e236]:
                - generic [ref=e237]: •
                - generic [ref=e238]: "Seizure: Goods can be seized if transported without valid GST documents"
              - listitem [ref=e239]:
                - generic [ref=e240]: •
                - generic [ref=e241]: "Prosecution: Evasion above Rs. 2 crore can lead to arrest without warrant"
            - paragraph [ref=e242]: "Use our penalty calculator for exact amounts: /tools/penalty-calculator/gst-late-filing"
          - generic [ref=e243]:
            - generic [ref=e244]:
              - generic [ref=e245]: FAQ
              - heading "Frequently Asked Questions" [level=2] [ref=e246]
            - generic [ref=e247]:
              - generic [ref=e248]:
                - paragraph [ref=e249]: I am a freelancer earning Rs. 15 lakh per year. All my clients are in my state. Do I need GST?
                - paragraph [ref=e250]: If all your clients are in the same state and your aggregate turnover is below Rs. 20 lakh, GST registration is not mandatory. But verify carefully - even one client in another state makes registration compulsory.
              - generic [ref=e251]:
                - paragraph [ref=e252]: What is the difference between aggregate turnover and taxable turnover?
                - paragraph [ref=e253]: Aggregate turnover includes the total value of all taxable supplies, exempt supplies, exports, and interstate supplies - calculated on a PAN-India basis, not state-wise. Taxable turnover is only the portion subject to GST. For determining the registration threshold, aggregate turnover is what matters.
              - generic [ref=e254]:
                - paragraph [ref=e255]: Can I register for GST even if I am below the threshold?
                - paragraph [ref=e256]: Yes. Section 25(3) allows voluntary registration. Once registered, you can issue tax invoices, collect GST, and claim input tax credit. Many small businesses register voluntarily for credibility and to work with larger clients.
              - generic [ref=e257]:
                - paragraph [ref=e258]: I sell on Instagram and WhatsApp. Is that e-commerce?
                - paragraph [ref=e259]: No. Selling directly via social media is not e-commerce under GST law. The e-commerce provision applies only when you sell through a platform that facilitates the transaction (like Amazon or Swiggy). Direct social selling is treated like any other direct sale.
              - generic [ref=e260]:
                - paragraph [ref=e261]: What happens if I cross the threshold mid-year?
                - paragraph [ref=e262]: You must apply for GST registration within 30 days of crossing the threshold. GST liability starts from the date you became liable, not the date you registered. Late registration means you owe GST on all supplies made after crossing the threshold.
