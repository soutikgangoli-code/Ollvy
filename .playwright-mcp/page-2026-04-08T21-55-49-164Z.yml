            - heading "More Questions" [level=2] [ref=e630]
          - generic [ref=e631]:
            - generic [ref=e632]:
              - heading "Can I use my home address as the registered office for a Pvt Ltd company?" [level=3] [ref=e633]
              - paragraph [ref=e634]: Yes. A residential address is fully legal as a registered office under the Companies Act. You need an electricity bill for that address and, if you are a tenant, a No Objection Certificate (NOC) from the property owner.
            - generic [ref=e635]:
              - heading "What if the name on PAN and Aadhaar are different?" [level=3] [ref=e636]
              - paragraph [ref=e637]: MCA will raise a query and the application will stall until the mismatch is resolved. You need to update either your PAN (through the income tax portal) or your Aadhaar (at an enrolment centre) to make them match before filing.
            - generic [ref=e638]:
              - heading "Do I need a separate DIN application before filing for incorporation?" [level=3] [ref=e639]
              - paragraph [ref=e640]: No. Director Identification Number is included in the SPICe+ incorporation form and is applied for simultaneously. You do not need a separate DIR-3 application. Only directors who already have a DIN from a previous directorship need to provide their existing DIN.
            - generic [ref=e641]:
              - heading "What documents does a foreign national director need?" [level=3] [ref=e642]
              - paragraph [ref=e643]: Passport (notarised and apostilled if from a foreign country), overseas address proof notarised by a notary public, and a photograph. The foreign director must also complete DSC video verification. At least one director must be an Indian resident.
            - generic [ref=e644]:
              - heading "How recent must the address proof be?" [level=3] [ref=e645]
              - paragraph [ref=e646]: Bank statements and utility bills must not be older than 2 months from the date of filing. This is a strict requirement. If you are filing in April, documents dated before February will be rejected.
