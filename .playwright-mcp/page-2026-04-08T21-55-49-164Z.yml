        - generic [ref=e494]:
          - generic [ref=e496]:
            - generic [ref=e497]: "02"
            - heading "Step-by-step process" [level=2] [ref=e498]
          - generic [ref=e499]:
            - generic [ref=e501]:
              - generic [ref=e503]: "1"
              - generic [ref=e504]:
                - heading "Get Digital Signature Certificates (DSC) for all directors" [level=3] [ref=e505]
                - paragraph [ref=e506]: Every proposed director needs a Class 3 DSC from a government-approved certifying authority. You'll use this to sign all MCA filings electronically. Takes 1-2 days to get.
            - generic [ref=e508]:
              - generic [ref=e510]: "2"
              - generic [ref=e511]:
                - heading "Apply for Director Identification Numbers (DIN)" [level=3] [ref=e512]
                - paragraph [ref=e513]: DIN is a unique ID for each director. Good news - for new companies, you can get DIN directly through the SPICe+ form without a separate application.
            - generic [ref=e515]:
              - generic [ref=e517]: "3"
              - generic [ref=e518]:
                - heading "Reserve your company name" [level=3] [ref=e519]
                - paragraph [ref=e520]: Use MCA's RUN service or SPICe+ Part A to check and reserve your name. It must end with "Private Limited" and can't be identical or too similar to existing companies or trademarks.
            - generic [ref=e522]:
              - generic [ref=e524]: "4"
              - generic [ref=e525]:
                - heading "Draft the Memorandum and Articles of Association" [level=3] [ref=e526]
                - paragraph [ref=e527]: The MOA defines what your company does; the AOA sets internal rules for how it runs. You can use MCA's standard templates (Table F) or have a professional draft custom documents for your business.
            - generic [ref=e529]:
              - generic [ref=e531]: "5"
              - generic [ref=e532]:
                - heading "File SPICe+ Part B on the MCA portal" [level=3] [ref=e533]
                - paragraph [ref=e534]: Fill in company details, director info, registered office address, capital details, and attach your MOA, AOA, address proof, and ID documents for all directors and shareholders.
            - generic [ref=e536]:
              - generic [ref=e538]: "6"
              - generic [ref=e539]:
                - heading "Submit AGILE-PRO for linked registrations" [level=3] [ref=e540]
                - paragraph [ref=e541]: Along with SPICe+, file AGILE-PRO to simultaneously get GSTIN, EPFO registration, ESIC registration, Professional Tax (where applicable), and even a bank account with select banks.
            - generic [ref=e543]:
              - generic [ref=e545]: "7"
              - generic [ref=e546]:
                - heading "Receive your Certificate of Incorporation" [level=3] [ref=e547]
                - paragraph [ref=e548]: After MCA approves everything, you get your Certificate of Incorporation with CIN, plus PAN and TAN from the Income Tax Department. Your company is now officially registered.
        - generic [ref=e549]:
          - generic [ref=e550]:
            - generic [ref=e551]: "03"
            - heading "Frequently Asked Questions" [level=2] [ref=e552]
          - generic [ref=e553]:
            - generic [ref=e554]:
              - heading "What's the minimum number of directors and shareholders?" [level=3] [ref=e555]
              - paragraph [ref=e556]: You need at least 2 directors and 2 shareholders, with a maximum of 200 shareholders. The same person can be both a director and shareholder. At least one director must be an Indian resident - meaning they've spent at least 182 days in India in the previous calendar year.
            - generic [ref=e557]:
              - heading "What's the minimum capital required?" [level=3] [ref=e558]
              - paragraph [ref=e559]: Technically, there's no minimum anymore - you can start a company with Rs. 1 as paid-up capital. Practically, most founders start with Rs. 1 lakh. Keep in mind that government stamp duty is based on your authorised capital, so don't set it higher than necessary.
            - generic [ref=e560]:
              - heading "Can foreigners be directors or shareholders?" [level=3] [ref=e561]
              - paragraph [ref=e562]: Yes, foreign nationals can be both directors and shareholders. The key requirement is that at least one director must be an Indian resident. Foreign directors need a DSC and must provide apostilled or notarised identity and address documents.
            - generic [ref=e563]:
              - heading "What annual compliance do I need to handle after incorporation?" [level=3] [ref=e564]
              - paragraph [ref=e565]: You'll need to file annual financial statements (Form AOC-4) and annual returns (Form MGT-7) with MCA, hold at least 4 board meetings per year, get a statutory audit done, and file income tax returns. If you're GST-registered, add those filings too. Non-compliance leads to significant penalties.
            - generic [ref=e566]:
              - heading "How do I convert my sole proprietorship or partnership to a Pvt Ltd?" [level=3] [ref=e567]
              - paragraph [ref=e568]: There's no direct conversion. You'd register a fresh Pvt Ltd company and then transfer business assets, contracts, and liabilities to the new entity. The fresh registration takes 7-15 days. Work with a professional on the legal and tax aspects of the transfer.
        - generic [ref=e569]:
          - generic [ref=e570]:
            - generic [ref=e571]: "04"
            - img [ref=e573]
            - heading "Common mistakes to avoid" [level=2] [ref=e575]
          - list [ref=e576]:
            - listitem [ref=e577]:
              - generic [ref=e578]: "01"
              - generic [ref=e579]: Proposing a name too similar to an existing company or registered trademark - instant rejection
            - listitem [ref=e580]:
              - generic [ref=e581]: "02"
              - generic [ref=e582]: Not checking RBI approval requirements before adding foreign nationals as directors or shareholders
            - listitem [ref=e583]:
              - generic [ref=e584]: "03"
              - generic [ref=e585]: Setting authorised capital higher than needed - you pay stamp duty on this amount
            - listitem [ref=e586]:
              - generic [ref=e587]: "04"
              - generic [ref=e588]: Drafting MOA business objects too narrowly, limiting what your company can do later
            - listitem [ref=e589]:
              - generic [ref=e590]: "05"
              - generic [ref=e591]: Missing the registered office verification deadline (30 days from incorporation)
            - listitem [ref=e592]:
              - generic [ref=e593]: "06"
              - generic [ref=e594]: Skipping the first board meeting, which must happen within 30 days of incorporation
            - listitem [ref=e595]:
              - generic [ref=e596]: "07"
              - generic [ref=e597]: Not opening a business bank account and depositing share capital on time
