              - generic [ref=e406]:
                - heading "What is this?" [level=4] [ref=e407]
                - paragraph [ref=e408]: PAN is a 10-character alphanumeric identifier issued by the Income Tax Department. It is mandatory for all MCA filings. For foreign nationals acting as directors, a passport serves in lieu of PAN.
              - generic [ref=e409]:
                - heading "How to get it" [level=4] [ref=e410]
                - paragraph [ref=e411]: Take a clear, well-lit photo of the front of the physical card. All 10 PAN characters must be legible. If you do not have a PAN, apply at incometax.gov.in.
              - generic [ref=e413]:
                - img [ref=e414]
                - generic [ref=e416]:
                  - heading "Common Issues" [level=4] [ref=e417]
                  - paragraph [ref=e418]: Name mismatch between PAN and Aadhaar is the most common rejection reason. "Rajesh Kumar Singh" on PAN vs "R K Singh" on Aadhaar causes rejection. Verify both documents match before submitting. Also check PAN-Aadhaar linkage at incometax.gov.in - an inoperative PAN causes rejection.
              - generic [ref=e419]:
                - heading "Requirements" [level=4] [ref=e420]
                - list [ref=e421]:
                  - listitem [ref=e422]:
                    - generic [ref=e423]: "01"
                    - generic [ref=e424]: Clear, coloured scan of original PAN card - not a photocopy of a photocopy
                  - listitem [ref=e425]:
                    - generic [ref=e426]: "02"
                    - generic [ref=e427]: All 10 characters of PAN number must be legible in the scan
                  - listitem [ref=e428]:
                    - generic [ref=e429]: "03"
                    - generic [ref=e430]: Name on PAN must exactly match name on Aadhaar card
                  - listitem [ref=e431]:
                    - generic [ref=e432]: "04"
                    - generic [ref=e433]: "For foreign nationals: passport is accepted in lieu of PAN"
                  - listitem [ref=e434]:
                    - generic [ref=e435]: "05"
                    - generic [ref=e436]: If PAN is not linked with Aadhaar, link it before submission - inoperative PAN causes rejection
                  - listitem [ref=e437]:
                    - generic [ref=e438]: "06"
                    - generic [ref=e439]: Corporate shareholders must provide the company PAN, not a director's personal PAN
