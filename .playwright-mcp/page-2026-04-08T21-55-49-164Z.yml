        - generic [ref=e73]:
          - paragraph [ref=e74]: A Private Limited Company is the most popular choice for startups in India. You get limited liability (your personal assets stay protected), a separate legal identity, and the credibility that makes it easier to raise funding and win larger clients.
          - paragraph [ref=e75]: Everything happens online through the MCA portal at mca.gov.in using the SPICe+ form. When you're done, you'll have a Certificate of Incorporation, CIN, PAN, and TAN - all from one application. The whole process takes 7-15 working days, depending on how clean your documents are and how busy the MCA is.
        - generic [ref=e77]:
          - paragraph [ref=e78]: Registering a Private Limited Company requires documents from all directors and shareholders, plus proof of the registered office address. Missing or mismatched documents are the most common cause of delays and MCA rejections - getting everything right before filing saves weeks.
          - paragraph [ref=e79]: The key documents are PAN and Aadhaar for all directors (the names must match exactly across both), address proof not older than 2 months, a registered office address with a utility bill, and an NOC from the property owner if the premises is rented. For the company itself, you need to decide on the proposed name (3 options recommended) and the business activities - these determine how the MOA is drafted.
          - paragraph [ref=e80]: DSC (Digital Signature Certificate) is required for all directors and is arranged as part of the incorporation process. It requires video verification and takes 2-3 working days. DIN (Director Identification Number) is included in the SPICe+ filing - no separate application needed.
          - paragraph [ref=e81]: Use this checklist to verify every document before submission. A single mismatch between the name on PAN and the name on Aadhaar will cause MCA to raise a query, adding 5-7 days to the timeline.
